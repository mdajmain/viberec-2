# Local stand-in for AWS RDS (PostgreSQL 16 + pgvector 0.8, the versions RDS supports).
# Start: docker compose -f deploy/docker-compose.yml up -d    Stop: docker compose -f deploy/docker-compose.yml down
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: viberec
      POSTGRES_PASSWORD: ${VIBEREC_DB_PASSWORD:-viberec-local-only}
      POSTGRES_DB: viberec
    ports:
      - "5433:5432"          # 5433 on the Mac, so it cannot clash with another local Postgres
    volumes:
      - viberec_pg:/var/lib/postgresql/data
volumes:
  viberec_pg:
